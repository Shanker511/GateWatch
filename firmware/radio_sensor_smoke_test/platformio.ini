[platformio]
default_envs = gatewatch-smoke-tx

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@^7.1.2
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

[env:gatewatch-smoke-tx]
build_src_filter = +<main.cpp> -<receiver.cpp>

[env:gatewatch-smoke-rx]
build_src_filter = -<main.cpp> +<receiver.cpp>
