name: Field test result
description: Record a GateWatch field or range test
title: "[Field Test]: "
labels: [testing]
body:
  - type: input
    id: date
    attributes:
      label: Test date and location
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Firmware commit
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and power setup
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Include distance, packet counts, RSSI/SNR, and failures
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence links or filenames
